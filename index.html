<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Journey Viewer</title>
        <style>
            html,
            body {
                margin: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
            canvas {
                width: 100%;
                height: 100%;
            }
        </style>
        
<script type="module">
import init, * as bindings from './journeyview.js';
const wasm = await init({ module_or_path: './journeyview_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script>
    <link rel="modulepreload" href="./journeyview.js" crossorigin="anonymous"><link rel="preload" href="./journeyview_bg.wasm" crossorigin="anonymous" as="fetch" type="application/wasm"></head>
    <body>
        <canvas id="rust-canvas"></canvas>
    </body>
</html>
