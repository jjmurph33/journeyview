[package]
name = "journeyview"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
egui = "0.36.1"
egui_plot = "0.37.0"
flexpolyline = "1.0.0"
geo-types = "0.7.20"
gpx = "0.10.0"
log = "0.4"
postcard = { version= "1.1.3", features = ["alloc"] }
qrcode = "0.14.1"
serde = "1.0.228"
walkers = "0.58.0"
zstd = "0.13.3"
rfd = "0.17.2"
poll-promise = "0.3.0"

# desktop dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11"
eframe = "0.36.1"
arboard = "3.6.1"
pollster = "0.4"

# web dependencies
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_log = "1.0"
eframe = { version = "0.36.1", default-features = false, features = [
    "default_fonts",
    "glow",
    "persistence",
] }
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "HtmlElement",
    "HtmlCanvasElement",
    "Storage",
    "UrlSearchParams",
    "Location",
    "console",
] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
